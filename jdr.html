<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créateur de Fiche de Personnage JDR</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --accent-hover: #3700b3;
            --error-color: #cf6679;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .import-section {
            background: #252525;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px dashed var(--accent-color);
            gap: 10px;
        }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }

        legend {
            color: var(--accent-color);
            font-weight: bold;
            padding: 0 8px;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        input, select, textarea {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #2c2c2c;
            color: white;
            font-size: 1rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            background: #252525;
            padding: 8px 12px;
            border-radius: 6px;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-bonus {
            font-size: 0.75rem;
            color: #aaa;
        }

        .stat-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button.stat-btn {
            background-color: #333;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.stat-btn:hover {
            background-color: var(--accent-color);
            color: black;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #9965f4;
        }

        .info-predilection {
            font-size: 0.8rem;
            color: #aaa;
            font-style: italic;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 550px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--accent-color);
        }

        .modal-content h2 {
            color: var(--accent-color);
            margin-top: 0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }

        .btn-copier { background-color: #03dac6; color: #121212; }
        .btn-copier:hover { background-color: #018786; color: white; }

        .btn-telecharger { background-color: #bb86fc; color: #121212; }
        .btn-telecharger:hover { background-color: #9965f4; }

        .close-btn {
            background-color: var(--error-color);
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Créateur de Personnage</h1>

    <!-- Section Importation -->
    <div class="import-section">
        <div>
            <strong>Importer une fiche :</strong><br>
            <span style="font-size: 0.85rem; color: #aaa;">Via un fichier JSON ou du texte brut</span>
        </div>
        <div style="display: flex; gap: 5px;">
            <input type="file" id="input-fichier" accept=".json" onchange="importerFicheJSON(event)" style="display: none;">
            <button class="btn-action btn-telecharger" onclick="document.getElementById('input-fichier').click()" style="padding: 6px 12px; font-size: 0.9rem;">📂 Fichier JSON</button>
            <button class="btn-action btn-copier" onclick="ouvrirModalTexte()" style="padding: 6px 12px; font-size: 0.9rem;">📥 Coller Texte</button>
        </div>
    </div>
    
    <div class="form-group">
        <label for="nom">Nom :</label>
        <input type="text" id="nom" placeholder="Ex: Ecu de chêne">
    </div>

    <div class="form-group">
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" placeholder="Ex: Gimli">
    </div>

    <div class="form-group">
        <label for="sexe">Sexe :</label>
        <select id="sexe">
            <option value="Homme">Homme</option>
            <option value="Femme">Femme</option>
        </select>
    </div>

    <div class="form-group">
        <label for="race">Race :</label>
        <select id="race" onchange="changerRace()">
            <option value="Humains">Humains</option>
            <option value="Le homme chat">Le homme chat</option>
            <option value="Les elfes">Les elfes</option>
            <option value="Le nains">Le nains</option>
            <option value="Le sang mélé">Le sang mélé (Semi-dragon / Semi-lézard)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="classe">Classe :</label>
        <select id="classe" onchange="changerClasse()">
            <!-- Généré dynamiquement en JS -->
        </select>
        <span id="predilection-info" class="info-predilection"></span>
    </div>

    <fieldset>
        <legend>Statistiques</legend>
        <div class="stats-header">
            <span id="max-points-label">Points max à distribuer : 27</span>
            <span id="points-restants">Restants : 27</span>
        </div>

        <div id="stats-container">
            <!-- Généré dynamiquement en JS -->
        </div>
    </fieldset>

    <fieldset>
        <legend>Histoire du Personnage</legend>
        <textarea id="histoire" rows="4" placeholder="Racontez l'histoire de votre personnage..."></textarea>
    </fieldset>

    <button class="btn-submit" onclick="genererFiche()">Générer la Fiche</button>
</div>

<!-- Modal pour coller le texte brut -->
<div id="modal-texte" class="modal">
    <div class="modal-content">
        <h2>Importer depuis du texte</h2>
        <p style="font-size: 0.85rem; color: #aaa;">Collez le texte de votre fiche de personnage (style Discord) ci-dessous :</p>
        <textarea id="zone-texte-import" rows="10" style="width: 100%; padding: 10px; background: #252525; color: white; border: 1px solid #444; border-radius: 5px;" placeholder="Collez votre texte ici..."></textarea>
        <div class="modal-buttons">
            <button class="btn-action btn-copier" onclick="analyserTexteImporte()">Analyser et Charger</button>
            <button class="btn-action close-btn" onclick="fermerModalTexte()">Annuler</button>
        </div>
    </div>
</div>

<!-- Fenêtre modale du résultat -->
<div id="modal-resultat" class="modal">
    <div class="modal-content">
        <h2>Fiche de Personnage</h2>
        <pre id="modal-body" style="white-space: pre-wrap; background: #252525; padding: 15px; border-radius: 5px; font-family: monospace; color: #fff;"></pre>
        <div class="modal-buttons">
            <button class="btn-action btn-copier" onclick="copierVersPressePapier()">Copier pour Discord</button>
            <button class="btn-action btn-telecharger" onclick="telechargerJSON()">💾 Télécharger .json</button>
            <button class="btn-action close-btn" onclick="fermerModalResultat()">Fermer</button>
        </div>
    </div>
</div>

<script>
    const classesGlobales = {
        "Guerrier": { desc: "Accessible à tous." },
        "Archer": { desc: "Tous les nains sont tireurs. Classe de prédilection des elfes." },
        "Mage": { desc: "Tous sauf les nains. Classe de prédilection des elfes." },
        "Voleur": { desc: "Accessible aux hommes-chats et autres races autorisées." },
        "Specialite_Nains": { desc: "Réservé exclusivement aux Nains." },
        "Paladin": { desc: "Tous sauf les nains. Classe de prédilection des sangs mêlés." }
    };

    const statsBaseParRace = {
        "Humains": { pv: 0, force: 0, charisme: 0, dexterite: 0, magie: 0, intelligence: 0 },
        "Le homme chat": { pv: 0, force: 0, charisme: 2, dexterite: 3, magie: 0, intelligence: 1 },
        "Les elfes": { pv: 0, force: 0, charisme: 0, dexterite: 1, magie: 4, intelligence: 3 },
        "Le nains": { pv: 4, force: 0, charisme: 0, dexterite: 2, magie: 0, intelligence: 0 },
        "Le sang mélé": { pv: 0, force: 3, charisme: 0, dexterite: 1, magie: 3, intelligence: 0 }
    };

    let pointsInvestis = { pv: 0, force: 0, charisme: 0, dexterite: 0, magie: 0, intelligence: 0 };
    let personnageActuel = {};

    function getMaxPoints() {
        const race = document.getElementById("race").value;
        return (race === "Le nains") ? 30 : 27;
    }

    function actualiserClasses(classeSelectionnee = null) {
        const race = document.getElementById("race").value;
        const selectClasse = document.getElementById("classe");
        selectClasse.innerHTML = "";

        let classesDispo = [];

        if (race === "Le nains") {
            classesDispo = ["Guerrier", "Archer", "Specialite_Nains"];
        } else if (race === "Le homme chat") {
            classesDispo = ["Guerrier", "Archer", "Mage", "Voleur", "Paladin"];
        } else {
            classesDispo = ["Guerrier", "Archer", "Mage", "Voleur", "Paladin"];
        }

        classesDispo.forEach(cls => {
            let option = document.createElement("option");
            option.value = cls;
            if(cls === "Specialite_Nains") option.textContent = "Spécialité Nains (Forgeron/Tank)";
            else option.textContent = cls;
            selectClasse.appendChild(option);
        });

        if (classeSelectionnee && classesDispo.includes(classeSelectionnee)) {
            selectClasse.value = classeSelectionnee;
        }

        changerClasse();
    }

    function changerClasse() {
        const classe = document.getElementById("classe").value;
        const info = document.getElementById("predilection-info");
        if (classesGlobales[classe]) {
            info.textContent = classesGlobales[classe].desc;
        }
    }

    function initialiserStats(reset = true) {
        if (reset) {
            pointsInvestis = { pv: 0, force: 0, charisme: 0, dexterite: 0, magie: 0, intelligence: 0 };
        }
        construireInterfaceStats();
        verifierPoints();
    }

    function construireInterfaceStats() {
        const container = document.getElementById("stats-container");
        container.innerHTML = "";
        const race = document.getElementById("race").value;
        const bonusRace = statsBaseParRace[race];

        for (let stat in pointsInvestis) {
            let row = document.createElement("div");
            row.className = "stat-row";

            let infoDiv = document.createElement("div");
            infoDiv.className = "stat-info";

            let label = document.createElement("span");
            label.textContent = stat.toUpperCase();
            infoDiv.appendChild(label);

            if (bonusRace[stat] > 0) {
                let bonusSpan = document.createElement("span");
                bonusSpan.className = "stat-bonus";
                bonusSpan.textContent = `(+${bonusRace[stat]} de race)`;
                infoDiv.appendChild(bonusSpan);
            }

            let controls = document.createElement("div");
            controls.className = "stat-controls";

            let btnMoins = document.createElement("button");
            btnMoins.className = "stat-btn";
            btnMoins.textContent = "-";
            btnMoins.onclick = () => modifierStat(stat, -1);

            let valSpan = document.createElement("span");
            valSpan.id = `val-${stat}`;
            let totalStat = bonusRace[stat] + pointsInvestis[stat];
            valSpan.textContent = totalStat;
            valSpan.style.width = "30px";
            valSpan.style.textAlign = "center";

            let btnPlus = document.createElement("button");
            btnPlus.className = "stat-btn";
            btnPlus.textContent = "+";
            btnPlus.onclick = () => modifierStat(stat, 1);

            controls.appendChild(btnMoins);
            controls.appendChild(valSpan);
            controls.appendChild(btnPlus);

            row.appendChild(infoDiv);
            row.appendChild(controls);
            container.appendChild(row);
        }
    }

    function getTotalInvesti() {
        let total = 0;
        for (let s in pointsInvestis) {
            total += pointsInvestis[s];
        }
        return total;
    }

    function verifierPoints() {
        const max = getMaxPoints();
        const totalUtilise = getTotalInvesti();
        const restants = max - totalUtilise;

        document.getElementById("max-points-label").textContent = `Max points à distribuer : ${max}`;
        const lblRestant = document.getElementById("points-restants");
        lblRestant.textContent = `Restants : ${restants}`;

        if (restants < 0) {
            lblRestant.style.color = "var(--error-color)";
        } else {
            lblRestant.style.color = "var(--text-color)";
        }
        return restants;
    }

    function modifierStat(stat, delta) {
        const max = getMaxPoints();

        if (delta > 0) {
            if (getTotalInvesti() >= max) {
                alert(`Vous avez atteint la limite maximale de ${max} points à distribuer !`);
                return;
            }
            pointsInvestis[stat]++;
        } else if (delta < 0) {
            if (pointsInvestis[stat] > 0) {
                pointsInvestis[stat]--;
            } else {
                alert("Vous ne pouvez pas descendre en dessous de 0 point investi.");
            }
        }

        const race = document.getElementById("race").value;
        const totalStat = statsBaseParRace[race][stat] + pointsInvestis[stat];
        document.getElementById(`val-${stat}`).textContent = totalStat;
        verifierPoints();
    }

    function changerRace() {
        actualiserClasses();
        initialiserStats(true);
    }

    // --- IMPORTATION FICHIER JSON ---
    function importerFicheJSON(event) {
        const fichier = event.target.files[0];
        if (!fichier) return;

        const lecteur = new FileReader();
        lecteur.onload = function(e) {
            try {
                const donnees = JSON.parse(e.target.result);
                chargerDonneesPersonnage(donnees);
                alert("Personnage importé avec succès depuis le fichier JSON !");
            } catch (err) {
                alert("Erreur lors de la lecture du fichier JSON : " + err);
            }
        };
        lecteur.readAsText(fichier);
    }

    // --- IMPORTATION DEPUIS DU TEXTE BRUT ---
    function ouvrirModalTexte() {
        document.getElementById("modal-texte").style.display = "flex";
    }

    function fermerModalTexte() {
        document.getElementById("modal-texte").style.display = "none";
    }

    function analyserTexteImporte() {
        const texte = document.getElementById("zone-texte-import").value;
        if (!texte.trim()) {
            alert("Veuillez coller du texte.");
            return;
        }

        try {
            const extraireValeur = (regex) => {
                const match = texte.match(regex);
                return match ? match[1].trim() : "";
            };

            const extraireStat = (nomStat) => {
                // Recherche flexible pour trouver "Stat : valeur" ou "- Stat : valeur"
                const regex = new RegExp(`(?:•|-)?\\s*\\*?\\*?${nomStat}\\*?\\*?\\s*[:=]\\s*(\\d+)`, "i");
                const match = texte.match(regex);
                return match ? parseInt(match[1]) : 0;
            };

            const nom = extraireValeur(/Nom\s*[:=]\s*([^\n\r]+)/i);
            const prenom = extraireValeur(/Prénom\s*[:=]\s*([^\n\r]+)/i);
            const sexe = extraireValeur(/Sexe\s*[:=]\s*([^\n\r]+)/i);
            let race = extraireValeur(/Race\s*[:=]\s*([^\n\r]+)/i);
            const classe = extraireValeur(/Classe\s*[:=]\s*([^\n\r]+)/i);

            // Normalisation des noms de races pour correspondre au select
            const racesDispo = ["Humains", "Le homme chat", "Les elfes", "Le nains", "Le sang mélé"];
            let raceTrouvee = racesDispo.find(r => r.toLowerCase() === race.toLowerCase()) || "Humains";

            // Récupération des stats totales lues dans le texte
            const pvTot = extraireStat("Pv");
            const forceTot = extraireStat("Force");
            const charismeTot = extraireStat("Charisme");
            const dexteriteTot = extraireStat("Dextérité");
            const magieTot = extraireStat("Magi(?:e)?");
            const intelligenceTot = extraireStat("Intelligence");

            // Extraction de l'histoire
            let histoire = "";
            const idxHistoire = texte.indexOf("HISTOIRE");
            if (idxHistoire !== -1) {
                let partieHistoire = texte.substring(idxHistoire);
                let lignes = partieHistoire.split(/[\r\n]+/);
                lignes.shift(); // Enlever la ligne du titre
                histoire = lignes.join("\n").trim();
            }

            const donneesImportees = {
                nom: nom,
                prenom: prenom,
                sexe: sexe || "Homme",
                race: raceTrouvee,
                classe: classe || "Guerrier",
                histoire: histoire,
                totauxStats: { pv: pvTot, force: forceTot, charisme: charismeTot, dexterite: dexteriteTot, magie: magieTot, intelligence: intelligenceTot }
            };

            chargerDonneesPersonnage(donneesImportees);
            fermerModalTexte();
            alert("Fiche importée avec succès depuis le texte !");
        } catch (err) {
            alert("Erreur lors de l'analyse du texte. Vérifiez le format. Erreur : " + err);
        }
    }

    function chargerDonneesPersonnage(donnees) {
        document.getElementById("nom").value = donnees.nom || "";
        document.getElementById("prenom").value = donnees.prenom || "";
        document.getElementById("sexe").value = donnees.sexe || "Homme";
        document.getElementById("race").value = donnees.race || "Humains";
        
        actualiserClasses(donnees.classe);

        if (donnees.pointsInvestis) {
            pointsInvestis = donnees.pointsInvestis;
        } else if (donnees.totauxStats) {
            const bonus = statsBaseParRace[donnees.race] || {pv:0, force:0, charisme:0, dexterite:0, magie:0, intelligence:0};
            for (let s in pointsInvestis) {
                pointsInvestis[s] = Math.max(0, (donnees.totauxStats[s] || 0) - (bonus[s] || 0));
            }
        }

        document.getElementById("histoire").value = donnees.histoire || "";
        construireInterfaceStats();
        verifierPoints();
    }

    function genererFiche() {
        const nom = document.getElementById("nom").value.trim();
        const prenom = document.getElementById("prenom").value.trim();
        const sexe = document.getElementById("sexe").value;
        const race = document.getElementById("race").value;
        const classe = document.getElementById("classe").value;
        const histoire = document.getElementById("histoire").value.trim();

        if (!nom || !prenom) {
            alert("Veuillez renseigner le Nom et le Prénom.");
            return;
        }

        const restants = verifierPoints();
        if (restants < 0) {
            alert("Vous avez dépassé le nombre de points autorisés !");
            return;
        }

        const bonusRace = statsBaseParRace[race];

        const pvTotal = bonusRace.pv + pointsInvestis.pv;
        const forceTotal = bonusRace.force + pointsInvestis.force;
        const charismeTotal = bonusRace.charisme + pointsInvestis.charisme;
        const dexteriteTotal = bonusRace.dexterite + pointsInvestis.dexterite;
        const magieTotal = bonusRace.magie + pointsInvestis.magie;
        const intelligenceTotal = bonusRace.intelligence + pointsInvestis.intelligence;

        personnageActuel = {
            nom, prenom, sexe, race, classe, histoire,
            pointsInvestis: { ...pointsInvestis },
            totauxStats: {
                pv: pvTotal, force: forceTotal, charisme: charismeTotal,
                dexterite: dexteriteTotal, magie: magieTotal, intelligence: intelligenceTotal
            }
        };

        const texteDiscord = 
`╔══════════════════════════════╗
       FICHE DE PERSONNAGE      
╚══════════════════════════════╝
🔹 **Nom** : ${nom}
🔹 **Prénom** : ${prenom}
🔹 **Sexe** : ${sexe}
🔹 **Race** : ${race}
🔹 **Classe** : ${classe}

--- ✦ **STATISTIQUES** ✦ ---
Vous avez ${restants} point(s) de state à répartir dans ses state (${race}) :
• **Pv** : ${pvTotal}
• **Force** : ${forceTotal}
• **Charisme** : ${charismeTotal}
• **Dextérité** : ${dexteriteTotal}
• **Magie** : ${magieTotal}
• **Intelligence** : ${intelligenceTotal}

--- ✦ **HISTOIRE** ✦ ---
${histoire || "Aucune histoire fournie."}`;

        document.getElementById("modal-body").textContent = texteDiscord;
        document.getElementById("modal-resultat").style.display = "flex";
    }

    function copierVersPressePapier() {
        const texte = document.getElementById("modal-body").textContent;
        navigator.clipboard.writeText(texte).then(() => {
            alert("Fiche copiée dans le presse-papiers ! Vous pouvez la coller sur Discord.");
        }).catch(err => {
            alert("Erreur lors de la copie : " + err);
        });
    }

    function telechargerJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(personnageActuel, null, 4));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `${personnageActuel.prenom}_${personnageActuel.nom}.json`.toLowerCase().replace(/\s+/g, '_'));
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function fermerModalResultat() {
        document.getElementById("modal-resultat").style.display = "none";
    }

    window.onload = function() {
        changerRace();
    };
</script>

</body>
</html>
