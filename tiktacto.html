<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe (Morpion)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        h1 {
            color: #333;
        }

        #status {
            margin-bottom: 20px;
            font-size: 1.5em;
            font-weight: bold;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            background-color: #333;
            border: 5px solid #333;
        }

        .cell {
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        .cell:hover:not(.x):not(.o) {
            background-color: #e0e0e0;
        }

        .x {
            color: #e74c3c; /* Rouge pour X */
        }

        .o {
            color: #3498db; /* Bleu pour O */
        }

        .win {
            background-color: #2ecc71 !important; /* Vert pour les cases gagnantes */
            color: white !important;
        }

        #reset-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        #reset-button:hover {
            background-color: #2471a3;
        }
    </style>
</head>
<body>
    <h1>Tic-Tac-Toe (Morpion)</h1>
    <div id="status">Joueur actuel : X</div>
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <button id="reset-button">Recommencer</button>

    <script>
        const cells = document.querySelectorAll('.cell');
        const statusDisplay = document.getElementById('status');
        const resetButton = document.getElementById('reset-button');
        
        let gameActive = true;
        let currentPlayer = 'X';
        // Représente l'état du plateau, 9 vides au début
        let gameState = ['', '', '', '', '', '', '', '', '']; 

        // Les combinaisons gagnantes (indices du tableau gameState)
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Lignes
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colonnes
            [0, 4, 8], [2, 4, 6] // Diagonales
        ];

        // --- Fonctions de gestion du jeu ---

        function handleCellPlayed(clickedCell, clickedCellIndex) {
            // Met à jour l'état du jeu et l'affichage de la case
            gameState[clickedCellIndex] = currentPlayer;
            clickedCell.innerHTML = currentPlayer;
            clickedCell.classList.add(currentPlayer.toLowerCase()); // Ajoute la classe pour la couleur
        }

        function handlePlayerChange() {
            // Change le joueur actuel et met à jour le statut
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusDisplay.innerHTML = `Joueur actuel : ${currentPlayer}`;
        }

        function handleResultValidation() {
            let roundWon = false;
            let winningCells = [];

            // Vérifie toutes les combinaisons gagnantes
            for (let i = 0; i < winningConditions.length; i++) {
                const winCondition = winningConditions[i];
                let a = gameState[winCondition[0]];
                let b = gameState[winCondition[1]];
                let c = gameState[winCondition[2]];

                // Si les trois cases ne sont pas vides et sont identiques
                if (a === '' || b === '' || c === '') {
                    continue;
                }
                if (a === b && b === c) {
                    roundWon = true;
                    winningCells = winCondition;
                    break;
                }
            }

            if (roundWon) {
                // Si quelqu'un a gagné
                statusDisplay.innerHTML = `gg a ${currentPlayer} tu a ganié🎉`;
                gameActive = false;
                
                // Met en évidence les cases gagnantes
                winningCells.forEach(index => {
                    cells[index].classList.add('win');
                });
                return;
            }

            // Vérifie s'il y a égalité (toutes les cases sont remplies et personne n'a gagné)
            let roundDraw = !gameState.includes('');
            if (roundDraw) {
                statusDisplay.innerHTML = `band de merde vous sa vais fais matche nul ! 🤝`;
                gameActive = false;
                return;
            }

            // Si le jeu n'est pas terminé, on passe au joueur suivant
            handlePlayerChange();
        }

        function handleCellClick(event) {
            const clickedCell = event.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            // Empêche de jouer si la case est déjà prise ou si le jeu est terminé
            if (gameState[clickedCellIndex] !== '' || !gameActive) {
                return;
            }

            handleCellPlayed(clickedCell, clickedCellIndex);
            handleResultValidation();
        }

        function handleRestartGame() {
            // Réinitialise les variables d'état
            gameActive = true;
            currentPlayer = 'X';
            gameState = ['', '', '', '', '', '', '', '', ''];
            
            // Réinitialise l'affichage
            statusDisplay.innerHTML = `Joueur actuel : ${currentPlayer}`;
            cells.forEach(cell => {
                cell.innerHTML = '';
                cell.classList.remove('x', 'o', 'win');
            });
        }

        // --- Écouteurs d'événements ---

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetButton.addEventListener('click', handleRestartGame);
    </script>
</body>
</html>
